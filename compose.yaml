services:
  app:
    build: .
    environment:
      PORT: "8000"
      GREETING: "${GREETING:-Привет, Docker!}"
      STORAGE: redis
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${HOST_PORT:-8080}:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2).close()"]
      interval: 3s
      timeout: 3s
      retries: 3
      start_period: 5s

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 3
      start_period: 5s

volumes:
  redis-data:
